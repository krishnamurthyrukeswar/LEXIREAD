[versions]
agp                 = "8.7.3"
kotlin              = "1.9.25"
ksp                 = "1.9.25-1.0.20"
coreKtx             = "1.15.0"
appcompat           = "1.7.0"
material            = "1.12.0"
constraintlayout    = "2.2.0"
lifecycle           = "2.8.7"
navigation          = "2.8.5"
room                = "2.6.1"
hilt                = "2.53.1"
hiltNavigation      = "1.2.0"
coroutines          = "1.9.0"
retrofit            = "2.11.0"
okhttp              = "4.12.0"
glide               = "4.16.0"
datastore           = "1.1.1"
firebaseBom         = "33.7.0"
pdfViewer           = "2.8.2"
readium             = "3.0.0-beta.2"
gson                = "2.11.0"
splashscreen        = "1.0.1"
swiperefresh        = "1.1.0"
viewpager2          = "1.1.0"
junit               = "4.13.2"
junitExt            = "1.2.1"
espresso            = "3.6.1"
mockk               = "1.13.13"
turbine             = "1.2.0"
truth               = "1.4.4"
googleServices      = "4.4.2"
firebaseCrashPlugin = "3.0.2"

[libraries]
# AndroidX Core
androidx-core-ktx           = { module = "androidx.core:core-ktx",                           version.ref = "coreKtx" }
androidx-appcompat          = { module = "androidx.appcompat:appcompat",                      version.ref = "appcompat" }
androidx-constraintlayout   = { module = "androidx.constraintlayout:constraintlayout",        version.ref = "constraintlayout" }
androidx-splashscreen       = { module = "androidx.core:core-splashscreen",                   version.ref = "splashscreen" }
androidx-swiperefresh       = { module = "androidx.swiperefreshlayout:swiperefreshlayout",    version.ref = "swiperefresh" }
androidx-viewpager2         = { module = "androidx.viewpager2:viewpager2",                    version.ref = "viewpager2" }

# Material Design 3
material                    = { module = "com.google.android.material:material",              version.ref = "material" }

# Lifecycle
lifecycle-viewmodel         = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx",         version.ref = "lifecycle" }
lifecycle-livedata          = { module = "androidx.lifecycle:lifecycle-livedata-ktx",          version.ref = "lifecycle" }
lifecycle-runtime           = { module = "androidx.lifecycle:lifecycle-runtime-ktx",           version.ref = "lifecycle" }

# Navigation
navigation-fragment         = { module = "androidx.navigation:navigation-fragment-ktx",       version.ref = "navigation" }
navigation-ui               = { module = "androidx.navigation:navigation-ui-ktx",             version.ref = "navigation" }

# Room
room-runtime                = { module = "androidx.room:room-runtime",                        version.ref = "room" }
room-ktx                    = { module = "androidx.room:room-ktx",                            version.ref = "room" }
room-compiler               = { module = "androidx.room:room-compiler",                       version.ref = "room" }

# Hilt
hilt-android                = { module = "com.google.dagger:hilt-android",                    version.ref = "hilt" }
hilt-compiler               = { module = "com.google.dagger:hilt-android-compiler",           version.ref = "hilt" }
hilt-navigation             = { module = "androidx.hilt:hilt-navigation-fragment",            version.ref = "hiltNavigation" }

# Coroutines
coroutines-core             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",     version.ref = "coroutines" }
coroutines-android          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",  version.ref = "coroutines" }

# Retrofit + OkHttp
retrofit                    = { module = "com.squareup.retrofit2:retrofit",                   version.ref = "retrofit" }
retrofit-gson               = { module = "com.squareup.retrofit2:converter-gson",             version.ref = "retrofit" }
okhttp                      = { module = "com.squareup.okhttp3:okhttp",                       version.ref = "okhttp" }
okhttp-logging              = { module = "com.squareup.okhttp3:logging-interceptor",          version.ref = "okhttp" }

# Glide
glide                       = { module = "com.github.bumptech.glide:glide",                   version.ref = "glide" }
glide-compiler              = { module = "com.github.bumptech.glide:ksp",                     version.ref = "glide" }

# DataStore
datastore-preferences       = { module = "androidx.datastore:datastore-preferences",          version.ref = "datastore" }

# Firebase (BOM)
firebase-bom                = { module = "com.google.firebase:firebase-bom",                  version.ref = "firebaseBom" }
firebase-auth               = { module = "com.google.firebase:firebase-auth-ktx" }
firebase-firestore          = { module = "com.google.firebase:firebase-firestore-ktx" }
firebase-storage            = { module = "com.google.firebase:firebase-storage-ktx" }
firebase-analytics          = { module = "com.google.firebase:firebase-analytics-ktx" }
firebase-crashlytics        = { module = "com.google.firebase:firebase-crashlytics-ktx" }

# PDF Viewer
pdf-viewer                  = { module = "com.github.mhiew:android-pdf-viewer",              version = "3.2.0-beta.3" }

# EPUB Reader (Readium 3)
readium-shared              = { module = "org.readium.kotlin-toolkit:readium-shared",         version.ref = "readium" }
readium-streamer            = { module = "org.readium.kotlin-toolkit:readium-streamer",       version.ref = "readium" }
readium-navigator           = { module = "org.readium.kotlin-toolkit:readium-navigator",      version.ref = "readium" }

# Gson
gson                        = { module = "com.google.code.gson:gson",                         version.ref = "gson" }

# Testing
junit                       = { module = "junit:junit",                                       version.ref = "junit" }
junit-ext                   = { module = "androidx.test.ext:junit",                           version.ref = "junitExt" }
espresso-core               = { module = "androidx.test.espresso:espresso-core",              version.ref = "espresso" }
mockk                       = { module = "io.mockk:mockk",                                   version.ref = "mockk" }
coroutines-test             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",     version.ref = "coroutines" }
turbine                     = { module = "app.cash.turbine:turbine",                          version.ref = "turbine" }
truth                       = { module = "com.google.truth:truth",                            version.ref = "truth" }
room-testing                = { module = "androidx.room:room-testing",                        version.ref = "room" }

[plugins]
android-application         = { id = "com.android.application",                               version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",                          version.ref = "kotlin" }
ksp                         = { id = "com.google.devtools.ksp",                               version.ref = "ksp" }
hilt                        = { id = "com.google.dagger.hilt.android",                        version.ref = "hilt" }
navigation-safeargs         = { id = "androidx.navigation.safeargs.kotlin",                   version.ref = "navigation" }
google-services             = { id = "com.google.gms.google-services",                        version.ref = "googleServices" }
firebase-crashlytics-plugin = { id = "com.google.firebase.crashlytics",                       version.ref = "firebaseCrashPlugin" }
